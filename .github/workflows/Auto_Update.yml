name: Build Caddy (Adaptive Style)

on:
  schedule:
    - cron: "0 0 * * *" # 每天检查一次
  workflow_dispatch:      # 手动运行

permissions:
  contents: write

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      # 1. 获取 Caddy 官方最新版本
      - name: Get latest Caddy version
        id: caddy
        uses: actions/github-script@v7
        with:
          script: |
            const release = await github.rest.repos.getLatestRelease({
              owner: 'caddyserver',
              repo: 'caddy',
            });
            core.setOutput('tag', release.data.tag_name);

      # 2. 获取我仓库的最新版本
      - name: Get my version
        id: mine
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const release = await github.rest.repos.getLatestRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
              });
              core.setOutput('tag', release.data.tag_name);
            } catch (e) {
              core.setOutput('tag', 'none');
            }

      # 3. 设置构建逻辑
      - name: Set Build Flag
        id: flag
        run: |
          if [ "${{ steps.caddy.outputs.tag }}" != "${{ steps.mine.outputs.tag }}" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run_build=true" >> $GITHUB_OUTPUT
          else
            echo "run_build=false" >> $GITHUB_OUTPUT
          fi

      # 4. 准备 Go 环境
      - name: Set up Go
        if: steps.flag.outputs.run_build == 'true'
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      # 5. 编译 Caddy 二进制 (修正了导入路径格式)
      - name: Build Caddy Binaries
        if: steps.flag.outputs.run_build == 'true'
        run: |
          # 安装 xcaddy
          go install ://github.com
          
          # 循环编译两个架构，注意这里的插件路径不带 https://
          for arch in amd64 arm64; do
            echo "正在构建 linux/$arch ..."
            GOOS=linux GOARCH=$arch ~/go/bin/xcaddy build ${{ steps.caddy.outputs.tag }} \
              --with ://github.com \
              --output caddy_linux_$arch
          done

      # 6. 发布 Release
      - name: Create Release
        if: steps.flag.outputs.run_build == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.caddy.outputs.tag }}
          name: Caddy ${{ steps.caddy.outputs.tag }} with Cloudflare DNS
          body: |
            Automatically built Caddy ${{ steps.caddy.outputs.tag }}
            
            Included plugins:
            - ://github.com
          files: |
            caddy_linux_amd64
            caddy_linux_arm64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
