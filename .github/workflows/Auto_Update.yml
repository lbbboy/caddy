name: Build Caddy (Auto Update)

on:
  schedule:
    - cron: "0 0 * * *" # 每天 UTC 0:00 (北京时间 8:00) 自动检查
  workflow_dispatch:      # 保留手动点击按钮触发功能

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.compare.outputs.should_run }}
      latest_tag: ${{ steps.get-latest.outputs.tag }}
    steps:
      - name: Get latest Caddy tag
        id: get-latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 使用 Token 请求 API，避免 jq 报错并解决频率限制问题
          RESPONSE=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
            https://github.com)
          
          TAG=$(echo "$RESPONSE" | jq -r .tag_name)
          
          # 验证返回的是否为有效版本号
          if [ "$TAG" == "null" ] || [ -z "$TAG" ]; then
            echo "错误: 无法获取 Caddy 版本信息。API 返回内容如下:"
            echo "$RESPONSE"
            exit 1
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Get my latest release tag
        id: get-mine
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 获取当前仓库最新的 Release 标签，若无则设为 none
          MY_TAG=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
            https://github.com{{ github.repository }}/releases/latest | jq -r .tag_name // "none")
          echo "my_tag=$MY_TAG" >> $GITHUB_OUTPUT

      - name: Compare versions
        id: compare
        run: |
          # 如果官方版本号与本地最新 Release 不一致，或者手动运行，则触发构建
          if [ "${{ steps.get-latest.outputs.tag }}" != "${{ steps.get-mine.outputs.my_tag }}" ]; then
            echo "检测到新版本: ${{ steps.get-latest.outputs.tag }}，开始构建。"
            echo "should_run=true" >> $GITHUB_OUTPUT
          else
            echo "版本已是最新，跳过构建。"
            echo "should_run=false" >> $GITHUB_OUTPUT
          fi

  build:
    needs: check-version
    # 仅在有更新或手动触发时运行
    if: needs.check-version.outputs.should_run == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Install xcaddy
        run: go install ://github.com

      - name: Build Caddy
        run: |
          # 编译指定版本的 Caddy 并集成 Cloudflare DNS 插件
          GOOS=linux GOARCH=${{ matrix.goarch }} ~/go/bin/xcaddy build ${{ needs.check-version.outputs.latest_tag }} \
            --with ://github.com \
            --output caddy_linux_${{ matrix.goarch }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: caddy_linux_${{ matrix.goarch }}
          path: caddy_linux_${{ matrix.goarch }}

  release:
    needs: [check-version, build]
    runs-on: ubuntu-latest
    if: needs.check-version.outputs.should_run == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check-version.outputs.latest_tag }}
          name: Caddy ${{ needs.check-version.outputs.latest_tag }} with Cloudflare DNS
          body: |
            ## 自动编译说明
            基于官方版本: `${{ needs.check-version.outputs.latest_tag }}`
            集成插件:
            - `://github.com` (latest)
            
            ## 文件说明
            - `caddy_linux_amd64`: 适用于 x86_64 架构 (普通服务器)
            - `caddy_linux_arm64`: 适用于 ARM64 架构 (树莓派/新架构云服务器)
          files: |
            caddy_linux_amd64/caddy_linux_amd64
            caddy_linux_arm64/caddy_linux_arm64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
