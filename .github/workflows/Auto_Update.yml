name: Build Caddy (Adaptive Style)

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Get latest Caddy version
        id: caddy
        uses: actions/github-script@v7
        with:
          script: |
            const release = await github.rest.repos.getLatestRelease({
              owner: 'caddyserver',
              repo: 'caddy',
            });
            core.setOutput('tag', release.data.tag_name);

      - name: Get my version
        id: mine
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const release = await github.rest.repos.getLatestRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
              });
              core.setOutput('tag', release.data.tag_name);
            } catch (e) {
              core.setOutput('tag', 'none');
            }

      - name: Set Build Flag
        id: flag
        run: |
          if [ "${{ steps.caddy.outputs.tag }}" != "${{ steps.mine.outputs.tag }}" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run_build=true" >> $GITHUB_OUTPUT
          else
            echo "run_build=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Go
        if: steps.flag.outputs.run_build == 'true'
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Build Caddy Binaries
        if: steps.flag.outputs.run_build == 'true'
        run: |
          # 定义包名变量，强制断开任何可能的自动 URL 补全
          XCADDY_REPO="://github.com"
          PLUGIN_REPO="://github.com"
          
          echo "Installing xcaddy..."
          go install $XCADDY_REPO
          
          for arch in amd64 arm64; do
            echo "Building linux/$arch..."
            # 使用变量拼接，确保不会被识别为 URL
            GOOS=linux GOARCH=$arch ~/go/bin/xcaddy build ${{ steps.caddy.outputs.tag }} \
              --with $PLUGIN_REPO \
              --output caddy_linux_$arch
          done

      - name: Create Release
        if: steps.flag.outputs.run_build == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.caddy.outputs.tag }}
          name: Caddy ${{ steps.caddy.outputs.tag }} with Cloudflare DNS
          body: |
            Automatically built Caddy ${{ steps.caddy.outputs.tag }}
            Included plugins: cloudflare dns
          files: |
            caddy_linux_amd64
            caddy_linux_arm64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
