name: Build Caddy (Adaptive Style)

on:
  schedule:
    - cron: "0 0 * * *" # 每天检查
  workflow_dispatch:      # 手动运行

permissions:
  contents: write

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      # 1. 获取官方最新版本 (使用官方提供的脚本工具，最稳)
      - name: Get latest Caddy version
        id: caddy
        uses: actions/github-script@v7
        with:
          script: |
            const release = await github.rest.repos.getLatestRelease({
              owner: 'caddyserver',
              repo: 'caddy',
            });
            core.setOutput('tag', release.data.tag_name);

      # 2. 获取我仓库的最新版本
      - name: Get my version
        id: mine
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const release = await github.rest.repos.getLatestRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
              });
              core.setOutput('tag', release.data.tag_name);
            } catch (e) {
              core.setOutput('tag', 'none');
            }

      # 3. 设置构建逻辑 (模仿第一个 CI 的 Env 判定)
      - name: Set Build Flag
        id: flag
        run: |
          if [ "${{ steps.caddy.outputs.tag }}" != "${{ steps.mine.outputs.tag }}" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run_build=true" >> $GITHUB_OUTPUT
          else
            echo "run_build=false" >> $GITHUB_OUTPUT
          fi

      # 4. 只有需要更新时才运行编译
      - name: Set up Go
        if: steps.flag.outputs.run_build == 'true'
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Build Caddy Binaries
        if: steps.flag.outputs.run_build == 'true'
        run: |
          go install ://github.com
          for arch in amd64 arm64; do
            GOOS=linux GOARCH=$arch ~/go/bin/xcaddy build ${{ steps.caddy.outputs.tag }} \
              --with ://github.com \
              --output caddy_linux_$arch
          done

      # 5. 发布 Release (模仿第一个 CI 的条件发布)
      - name: Create Release
        if: steps.flag.outputs.run_build == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.caddy.outputs.tag }}
          name: Caddy ${{ steps.caddy.outputs.tag }} with Cloudflare DNS
          body: |
            Automatically built Caddy ${{ steps.caddy.outputs.tag }}
            Included plugins: cloudflare dns
          files: |
            caddy_linux_amd64
            caddy_linux_arm64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
